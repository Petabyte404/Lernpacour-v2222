<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>ByteSoft Challenge</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#020617;
  color:white;
  text-align:center;
}

.card {
  background:rgba(255,255,255,0.05);
  padding:25px;
  border-radius:15px;
  width:340px;
  margin:40px auto;
}

button {
  padding:10px;
  margin:5px;
  border:none;
  border-radius:8px;
  background:#3b82f6;
  color:white;
  cursor:pointer;
}

.choice {
  width:100%;
  display:block;
}

.hidden { display:none; }

.loader {
  font-size:18px;
}
</style>
</head>

<body>

<h1>ByteSoft</h1>

<div id="login" class="card">
  <input id="code" placeholder="Code"><br>
  <button onclick="start()">Start</button>

  <div id="lb1"></div>
</div>

<div id="quiz" class="card hidden">
  <input id="team" placeholder="Team"><br><br>
  <div id="q"></div>
  <button onclick="submit()">Absenden</button>
</div>

<div id="loading" class="card hidden">
⏳ Ergebnisse werden ausgewertet...
</div>

<div id="result" class="card hidden">
<h2 id="score"></h2>
<div id="lb2"></div>
</div>

<script>

const API = "https://script.google.com/macros/s/AKfycbwumvk25jZJFI240Os_dRx4Y42b1E2BIBxk8fHcjtOcQS1-ZpP0uYW3TXcwcWVe1mA77g/exec";
const CODE = "TEST";

const answers = ["a","c","a","b"];
let user = [];

/* ---------------- UI ---------------- */

function show(id){
  ["login","quiz","loading","result"].forEach(x =>
    document.getElementById(x).classList.add("hidden")
  );
  document.getElementById(id).classList.remove("hidden");
}

/* ---------------- LOGIN ---------------- */

function start(){
  if(code.value.toUpperCase() === CODE){
    show("quiz");
    render();
  } else alert("Falsch");
}

/* ---------------- QUIZ ---------------- */

function render(){
  const q = document.getElementById("q");

  answers.forEach((_,i)=>{
    q.innerHTML += `
      <p>Frage ${i+1}</p>
      <button class="choice" onclick="pick(${i},'a')">A</button>
      <button class="choice" onclick="pick(${i},'b')">B</button>
      <button class="choice" onclick="pick(${i},'c')">C</button>
      <button class="choice" onclick="pick(${i},'d')">D</button>
    `;
  });
}

function pick(i,v){
  user[i] = v;
}

/* ---------------- SUBMIT (NO-CORS SAFE) ---------------- */

async function submit(){
  show("loading");

  let score = 0;
  answers.forEach((a,i)=>{
    if(user[i] === a) score++;
  });

  const ip = await fetch("https://api.ipify.org?format=json")
    .then(r => r.json())
    .catch(() => ({ip:"unknown"}));

  // 🔥 NO-CORS FIX (wichtig!)
  fetch(API, {
    method: "POST",
    mode: "no-cors",
    body: JSON.stringify({
      team: team.value,
      score: score,
      userAgent: navigator.userAgent,
      ip: ip.ip
    })
  });

  // 15s fake loading
  setTimeout(()=>{
    document.getElementById("score").innerText =
      `Score: ${score}/${answers.length}`;

    show("result");
    loadLB("lb2");
  },15000);
}

/* ---------------- LEADERBOARD SAFE LOAD ---------------- */

async function loadLB(id){
  try {
    const res = await fetch(API + "?t=" + Date.now());
    const text = await res.text();
    const data = JSON.parse(text);

    document.getElementById(id).innerHTML =
      "<h3>Bestenliste</h3><ol>" +
      data.slice(0,10).map(x =>
        `<li>${x.team} - ${x.score}</li>`
      ).join("") +
      "</ol>";

  } catch(e){
    console.log("LB error", e);
  }
}

/* ---------------- AUTO REFRESH ---------------- */

setInterval(()=>loadLB("lb1"),10000);
loadLB("lb1");

</script>

</body>
</html>
