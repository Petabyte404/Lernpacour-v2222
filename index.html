<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ByteSoft Quiz</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#020617;
  color:white;
  text-align:center;
}

.card{
  width:360px;
  margin:30px auto;
  padding:20px;
  background:rgba(255,255,255,0.05);
  border-radius:15px;
}

input{
  width:90%;
  padding:10px;
  border-radius:8px;
  border:none;
}

button{
  width:100%;
  margin-top:10px;
  padding:10px;
  border:none;
  border-radius:8px;
  background:#3b82f6;
  color:white;
  cursor:pointer;
}

.hidden{ display:none; }

.choice{
  margin:5px 0;
}
</style>
</head>

<body>

<h1>ByteSoft Quiz</h1>

<div id="login" class="card">
  <input id="code" placeholder="Code">
  <button onclick="start()">Start</button>
</div>

<div id="quiz" class="card hidden">
  <input id="team" placeholder="Teamname">
  <div id="q"></div>
  <button onclick="submitQuiz()">Absenden</button>
</div>

<div id="loading" class="card hidden">
  ⏳ Wird gesendet...
</div>

<div id="result" class="card hidden">
  <h2 id="score"></h2>
  <div id="lb"></div>
</div>

<script>

/* ================= CONFIG ================= */

const API = "https://script.google.com/macros/s/AKfycbzuzNovDynOk-6-vPQDCe5Fhio8OMRxGBXe44UZv81laRefPxPTG0Ym6e6xEAOF9DDT9w/exec";
const CODE = "TEST";

/* ================= QUIZ ================= */

const answers = ["a","c","a","b"];
let user = [];

/* ================= UI ================= */

function show(id){
  ["login","quiz","loading","result"].forEach(x=>{
    document.getElementById(x).classList.add("hidden");
  });
  document.getElementById(id).classList.remove("hidden");
}

/* ================= START ================= */

function start(){
  if(code.value.toUpperCase() !== CODE){
    alert("Falscher Code");
    return;
  }

  show("quiz");
  render();
}

/* ================= QUESTIONS ================= */

function render(){

  const q = document.getElementById("q");
  q.innerHTML = "";

  answers.forEach((_,i)=>{

    q.innerHTML += `
      <div>
        <p>Frage ${i+1}</p>

        <button class="choice" onclick="pick(${i},'a')">A</button>
        <button class="choice" onclick="pick(${i},'b')">B</button>
        <button class="choice" onclick="pick(${i},'c')">C</button>
        <button class="choice" onclick="pick(${i},'d')">D</button>
      </div>
    `;
  });
}

/* ================= PICK ================= */

function pick(i,v){
  user[i] = v;
}

/* ================= SUBMIT ================= */

async function submitQuiz(){

  show("loading");

  let score = 0;

  answers.forEach((a,i)=>{
    if(user[i] === a) score++;
  });

  try {

    const form = new FormData();
    form.append("team", document.getElementById("team").value || "Unknown");
    form.append("score", score);
    form.append("userAgent", navigator.userAgent);
    form.append("ip", "hidden");

    await fetch(API, {
      method: "POST",
      body: form
    });

  } catch(e){
    console.log(e);
  }

  setTimeout(()=>{
    document.getElementById("score").innerText =
      `Score: ${score}/${answers.length}`;

    show("result");

    loadLB();
  },1500);
}

/* ================= LEADERBOARD ================= */

async function loadLB(){

  try {

    const res = await fetch(API);
    const data = await res.json();

    document.getElementById("lb").innerHTML =
      "<h3>🏆 Leaderboard</h3><ol>" +
      data.slice(0,10).map(x =>
        `<li>${x.team} - ${x.score}</li>`
      ).join("") +
      "</ol>";

  } catch(e){
    console.log("LB error", e);
  }
}

setInterval(loadLB,10000);

</script>

</body>
</html>
