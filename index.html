<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>ByteSoft</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#020617;
  color:white;
  text-align:center;
}

.card {
  background:rgba(255,255,255,0.05);
  padding:25px;
  border-radius:15px;
  width:320px;
  margin:50px auto;
}

button {
  padding:10px;
  margin:5px;
  border:none;
  border-radius:8px;
  background:#3b82f6;
  color:white;
  cursor:pointer;
}

button:hover { background:#2563eb; }

.hidden { display:none; }

.choice {
  display:block;
  width:100%;
}

.loader {
  font-size:18px;
}
</style>
</head>

<body>

<h1>ByteSoft</h1>

<div id="login" class="card">
  <h3>Code</h3>
  <input id="code" maxlength="4"><br>
  <button onclick="login()">Start</button>

  <div id="leaderboard1"></div>
</div>

<div id="quiz" class="card hidden">
  <input id="team" placeholder="Teamname"><br><br>
  <div id="questions"></div>
  <button onclick="submit()">Abschicken</button>
</div>

<div id="loading" class="card hidden">
  <div class="loader">⏳ Ergebnisse werden ausgewertet...</div>
</div>

<div id="result" class="card hidden">
  <h2 id="score"></h2>
  <div id="leaderboard2"></div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbwumvk25jZJFI240Os_dRx4Y42b1E2BIBxk8fHcjtOcQS1-ZpP0uYW3TXcwcWVe1mA77g/exec";
const CODE = "7G5K";

let answers = ["a","c","a","b"];
let userAnswers = [];

// LOGIN
function login() {
  if (document.getElementById("code").value.toUpperCase() === CODE) {
    show("quiz");
    render();
  } else {
    alert("Falsch");
  }
}

// UI SWITCH
function show(id) {
  ["login","quiz","loading","result"].forEach(x =>
    document.getElementById(x).classList.add("hidden")
  );
  document.getElementById(id).classList.remove("hidden");
}

// QUESTIONS
function render() {
  const q = document.getElementById("questions");
  q.innerHTML = "";

  answers.forEach((_, i) => {
    q.innerHTML += `
      <p>Frage ${i+1}</p>
      <button class="choice" onclick="choose(${i},'a')">A</button>
      <button class="choice" onclick="choose(${i},'b')">B</button>
      <button class="choice" onclick="choose(${i},'c')">C</button>
      <button class="choice" onclick="choose(${i},'d')">D</button>
    `;
  });
}

function choose(i,val) {
  userAnswers[i] = val;
}

// SUBMIT
async function submit() {
  show("loading");

  let score = 0;
  answers.forEach((a,i)=>{
    if(userAnswers[i]===a) score++;
  });

  const ipData = await fetch("https://api.ipify.org?format=json")
    .then(r=>r.json());

  fetch(API,{
    method:"POST",
    body:JSON.stringify({
      team: document.getElementById("team").value,
      score: score,
      userAgent: navigator.userAgent,
      ip: ipData.ip
    })
  });

  // 15 Sekunden warten
  setTimeout(()=>{
    document.getElementById("score").innerText =
      `Score: ${score}/${answers.length}`;
    show("result");
    loadLeaderboard("leaderboard2");
  },15000);
}

// LEADERBOARD
async function loadLeaderboard(target) {
  try {
    const res = await fetch(API);
    const data = await res.json();

    let html = "<h3>Bestenliste</h3><ol>";
    data.slice(0,10).forEach(e=>{
      html += `<li>${e.team} - ${e.score}</li>`;
    });
    html += "</ol>";

    document.getElementById(target).innerHTML = html;
  } catch {
    document.getElementById(target).innerText = "Fehler";
  }
}

// AUTO UPDATE
setInterval(()=>{
  loadLeaderboard("leaderboard1");
},10000);

// INIT
loadLeaderboard("leaderboard1");
</script>

</body>
</html>
