<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>ByteSoft Challenge</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#020617;
  color:white;
  text-align:center;
}

.card {
  background:rgba(255,255,255,0.05);
  padding:25px;
  border-radius:15px;
  width:320px;
  margin:40px auto;
}

button {
  padding:10px;
  margin:5px;
  border:none;
  border-radius:8px;
  background:#3b82f6;
  color:white;
}

.choice { width:100%; display:block; }

.hidden { display:none; }
</style>
</head>

<body>

<h1>ByteSoft</h1>

<div id="login" class="card">
  <input id="code" placeholder="Code"><br>
  <button onclick="start()">Start</button>
  <div id="lb1"></div>
</div>

<div id="quiz" class="card hidden">
  <input id="team" placeholder="Team"><br><br>
  <div id="q"></div>
  <button onclick="submit()">Absenden</button>
</div>

<div id="loading" class="card hidden">
⏳ Auswertung...
</div>

<div id="result" class="card hidden">
<h2 id="score"></h2>
<div id="lb2"></div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbwumvk25jZJFI240Os_dRx4Y42b1E2BIBxk8fHcjtOcQS1-ZpP0uYW3TXcwcWVe1mA77g/exec";
const CODE = "7G5K";

let answers = ["a","c","a","b"];
let user = [];

function show(id){
  ["login","quiz","loading","result"].forEach(x =>
    document.getElementById(x).classList.add("hidden")
  );
  document.getElementById(id).classList.remove("hidden");
}

function start(){
  if(code.value.toUpperCase()===CODE){
    show("quiz");
    render();
  }
}

function render(){
  const q = document.getElementById("q");
  answers.forEach((_,i)=>{
    q.innerHTML += `
      <p>Frage ${i+1}</p>
      <button class="choice" onclick="pick(${i},'a')">A</button>
      <button class="choice" onclick="pick(${i},'b')">B</button>
      <button class="choice" onclick="pick(${i},'c')">C</button>
      <button class="choice" onclick="pick(${i},'d')">D</button>
    `;
  });
}

function pick(i,v){ user[i]=v; }

async function submit(){
  show("loading");

  let score=0;
  answers.forEach((a,i)=>{
    if(user[i]===a) score++;
  });

  const ip = await fetch("https://api.ipify.org?format=json")
    .then(r=>r.json());

  fetch(API,{
    method:"POST",
    body:JSON.stringify({
      team: team.value,
      score,
      userAgent:navigator.userAgent,
      ip:ip.ip
    })
  });

  setTimeout(()=>{
    scoreText(score);
    show("result");
    loadLB("lb2");
  },15000);
}

function scoreText(s){
  document.getElementById("score").innerText =
    `Score: ${s}/${answers.length}`;
}

async function loadLB(id){
  const res = await fetch(API);
  const data = await res.json();

  document.getElementById(id).innerHTML =
    "<h3>Bestenliste</h3><ol>" +
    data.slice(0,10).map(x =>
      `<li>${x.team} - ${x.score}</li>`
    ).join("") +
    "</ol>";
}

setInterval(()=>loadLB("lb1"),10000);
loadLB("lb1");
</script>

</body>
</html>
