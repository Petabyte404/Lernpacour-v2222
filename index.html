<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ByteSoft Quiz</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#020617;
  color:white;
  text-align:center;
}

.card{
  width:360px;
  margin:30px auto;
  padding:20px;
  background:rgba(255,255,255,0.05);
  border-radius:15px;
}

input{
  width:90%;
  padding:10px;
  border:none;
  border-radius:8px;
  margin:8px 0;
}

button{
  width:100%;
  padding:10px;
  border:none;
  border-radius:8px;
  background:#3b82f6;
  color:white;
  cursor:pointer;
}

.hidden{ display:none; }

.choice{
  margin:5px 0;
}
</style>
</head>

<body>

<h1>ByteSoft Quiz</h1>

<div id="login" class="card">
  <input id="code" placeholder="Code">
  <button onclick="start()">Start</button>
</div>

<div id="quiz" class="card hidden">
  <input id="team" placeholder="Teamname">

  <div id="q"></div>

  <button onclick="submitQuiz()">Absenden</button>
</div>

<div id="result" class="card hidden">
  <h2 id="score"></h2>
</div>

<script>

/* ================= CONFIG ================= */

const WEBHOOK = "DEIN_DISCORD_WEBHOOK_HIER";
const CODE = "TEST";

const answers = ["a","c","a","b"];
let user = [];

/* ================= UI ================= */

function show(id){
  ["login","quiz","result"].forEach(x=>{
    document.getElementById(x).classList.add("hidden");
  });
  document.getElementById(id).classList.remove("hidden");
}

/* ================= START ================= */

function start(){
  if(code.value.toUpperCase() !== CODE){
    alert("Falscher Code");
    return;
  }

  show("quiz");
  render();
}

/* ================= QUIZ ================= */

function render(){

  const q = document.getElementById("q");
  q.innerHTML = "";

  answers.forEach((_,i)=>{

    q.innerHTML += `
      <div>
        <p>Frage ${i+1}</p>

        <button class="choice" onclick="pick(${i},'a')">A</button>
        <button class="choice" onclick="pick(${i},'b')">B</button>
        <button class="choice" onclick="pick(${i},'c')">C</button>
        <button class="choice" onclick="pick(${i},'d')">D</button>
      </div>
    `;
  });
}

/* ================= PICK ================= */

function pick(i,v){
  user[i] = v;
}

/* ================= DISCORD SEND ================= */

async function sendDiscord(team, score){

  const payload = {
    content: "📊 Neues Quiz Ergebnis",
    embeds: [{
      title: "ByteSoft Quiz",
      color: 5814783,
      fields: [
        { name: "Team", value: team || "Unknown", inline: true },
        { name: "Score", value: String(score), inline: true },
        { name: "Zeit", value: new Date().toLocaleString(), inline: false }
      ]
    }]
  };

  await fetch(WEBHOOK, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(payload)
  });

}

/* ================= SUBMIT ================= */

async function submitQuiz(){

  let score = 0;

  answers.forEach((a,i)=>{
    if(user[i] === a) score++;
  });

  document.getElementById("score").innerText =
    `Score: ${score}/${answers.length}`;

  show("result");

  await sendDiscord(
    team.value,
    score
  );
}

</script>

</body>
</html>
